[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "republica-escala"
version = "0.2.0"
description = "Módulo de escala de rodízio ponderado do sistema de gestão de repúblicas (INF 323)"
requires-python = ">=3.10"
dependencies = ["flask>=3"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
escala = ["web/templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["requisito(*ids): IDs de requisitos verificados pelo teste (GRE3)"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Prevenção de code smells: complexidade, métodos longos, muitos parâmetros,
# números mágicos, variáveis não usadas, código duplicado simples.
select = ["E", "F", "C90", "PLR", "SIM", "B", "N"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 15
max-returns = 3
